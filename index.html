<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div>
          <h1>To-Do List</h1>
          <p>Organize your day, one task at a time.</p>
        </div>
        <button
          id="themeToggle"
          class="theme-btn"
          aria-label="Toggle dark mode"
        >
          <i class="bi bi-moon-fill"></i>
        </button>
      </header>

      <section class="welcome">
        <h2>My Tasks</h2>
        <p>Stay focused and get things done.</p>
      </section>

      <section class="stats">
        <div class="stat-card">
          <span class="stat-icon"> <i class="bi bi-hourglass-split"></i> </span>
          <p>Total Tasks</p>
          <h2 id="totalCount">0</h2>
        </div>
        <div class="stat-card">
          <span class="stat-icon"> <i class="bi bi-clock"></i> </span>
          <p>Pending</p>
          <h2 id="pendingCount">0</h2>
        </div>
        <div class="stat-card">
          <span class="stat-icon"> <i class="bi bi-check2-circle"></i> </span>
          <p>Completed</p>
          <h2 id="completedCount">0</h2>
        </div>
      </section>

      <section class="task-form-section">
        <h2 id="formTitle">Add a New Task</h2>

        <form id="taskForm">
          <div class="form-group">
            <label for="taskTitle">Task Title *</label>
            <input
              type="text"
              id="taskTitle"
              placeholder="What do you need to do?"
              maxlength="100"
              required
            />
          </div>

          <div class="form-group">
            <label for="taskDescription">Description</label>
            <textarea
              id="taskDescription"
              placeholder="Add task details (optional)"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="taskCategory">Category</label>
              <select id="taskCategory">
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskPriority">Priority</label>
              <select id="taskPriority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskDueDate">Due Date</label>
              <input type="date" id="taskDueDate" />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="primary-btn">
              + Add Task
            </button>
            <button type="button" id="cancelEdit" class="secondary-btn hidden">
              Cancel
            </button>
          </div>
        </form>
      </section>

      <section class="tasks-section">
        <div class="section-heading">
          <h2>My Task List</h2>
          <span id="resultCount">0 tasks</span>
        </div>

        <div class="toolbar">
          <input
            type="search"
            id="searchInput"
            placeholder="Search tasks..."
            aria-label="Search tasks"
          />

          <select id="statusFilter" aria-label="Filter by status">
            <option value="All">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
          </select>

          <select id="categoryFilter" aria-label="Filter by category">
            <option value="All">All Categories</option>
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>

          <select id="priorityFilter" aria-label="Filter by priority">
            <option value="All">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
        </div>

        <div id="taskList" class="task-list"></div>

        <div id="emptyState" class="empty-state">
          <div>
            <i class="bi bi-pencil-square"></i>
          </div>
          <h3>No tasks found</h3>
          <p>Add a task or change your search and filters.</p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
